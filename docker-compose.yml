services:
  backend:
    build:
      context: ./graduation_work_springBoot
    container_name: backend
    restart: always
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Docker Compose 内部访问 MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-smart_agriculture}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}

      # Docker Compose 内部访问 PostgreSQL
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-agriculture_ai}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-123456}

      # Docker Compose 内部访问 Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Docker Compose 内部访问 MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_password_123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-agriculture}

      AL_API_KEY: ${AL_API_KEY:?Please set AL_API_KEY in .env}

    depends_on:
      - mysql
      - postgres
      - redis
      - minio

  frontend:
    build:
      context: ./graduation_work_vue
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # ============================================================
  # Docker 独立 MySQL
  # 与服务器原有 MySQL 完全独立
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: smart-agriculture-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-smart_agriculture}

    # 宿主机 3307 -> Docker MySQL 3306
    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./graduation_work_springBoot/sql/smart_agriculture.sql:/docker-entrypoint-initdb.d/01-smart_agriculture.sql:ro
      - ./graduation_work_springBoot/sql/rbac_init.sql:/docker-entrypoint-initdb.d/02-rbac_init.sql:ro

  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: ${PG_DB:-agriculture_ai}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-123456}

    volumes:
      - pg_data:/var/lib/postgresql/data

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7
    container_name: redis
    restart: always

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio
    container_name: minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_password_123}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  pg_data:
  minio_data: