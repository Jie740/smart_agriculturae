services:
  # ============================================================
  # Backend - Spring Boot
  # ============================================================
  backend:
    build:
      context: ./graduation_work_springBoot
    image: ajiey/smart_agriculture:backend
    container_name: smart-agriculture-backend
    restart: always
    expose:
      - "8080"

    environment:
      SPRING_PROFILES_ACTIVE: prod

      # Docker Compose 内部访问 MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-smart_agriculture}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}

      # Docker Compose 内部访问 PostgreSQL
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-agriculture_ai}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-123456}

      # Docker Compose 内部访问 Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Docker Compose 内部访问 MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_password_123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-agriculture}

      # 阿里云 DashScope
      AL_API_KEY: ${AL_API_KEY:?Please set AL_API_KEY in .env}

    depends_on:
      - mysql
      - postgres
      - redis
      - minio

  # ============================================================
  # Frontend - Vue + Nginx
  # ============================================================
  frontend:
    build:
      context: ./graduation_work_vue
    image: ajiey/smart_agriculture:frontend
    container_name: smart-agriculture-frontend
    restart: always

    security_opt:
      - seccomp=unconfined

    ports:
      - "80:80"
    depends_on:
      - backend

  # ============================================================
  # MySQL
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: smart-agriculture-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-smart_agriculture}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/mysql:/docker-entrypoint-initdb.d:ro

  # ============================================================
  # PostgreSQL + pgvector
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-agriculture-postgres
    restart: always

    environment:
      POSTGRES_DB: ${PG_DB:-agriculture_ai}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-123456}

    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data/postgres:/docker-entrypoint-initdb.d:ro

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7
    container_name: smart-agriculture-redis
    restart: always

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: smart-agriculture-minio
    restart: always

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_password_123}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

# ==============================================================
# Volumes
# ==============================================================
volumes:
  mysql_data:
  pg_data:
  minio_data:
